[package]
name = "surfxr_server_core"
version.workspace = true
edition.workspace = true
authors = ["SurfXR contributors", "alvr-org", "Valve Corporation"]
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
trace-performance = ["profiling/profile-with-tracy"]

[dependencies]
surfxr_audio.workspace = true
surfxr_common.workspace = true
surfxr_events.workspace = true
surfxr_filesystem.workspace = true
surfxr_packets.workspace = true
surfxr_server_io.workspace = true
surfxr_session.workspace = true
surfxr_sockets.workspace = true

ash = "0.38"
axum = { version = "0.8", features = ["ws"] }
bincode = { version = "2", features = ["serde"] }
chrono = "0.4"
fern = "0.7"
flume = "0.11"
mdns-sd = "0.19"
profiling = { version = "1", optional = true }
rfd = "0.17"
rosc = "0.11"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "fs",
] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = "1"
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
