[package]
name = "surfxr_dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
surfxr_common.workspace = true
surfxr_events.workspace = true
surfxr_filesystem.workspace = true
surfxr_packets.workspace = true
surfxr_session.workspace = true
surfxr_sockets.workspace = true
surfxr_gui_common.workspace = true
surfxr_audio.workspace = true

chrono = "0.4"
eframe = "0.35"
env_logger = "0.11"
ico = "0.5"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings-schema = { git = "https://github.com/alvr-org/settings-schema-rs", rev = "676185f" }
statrs = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
surfxr_server_io.workspace = true
runas = "^1.2"
sysinfo = "0.38"
tungstenite = "0.29"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = "25"
libva = { package = "cros-libva", version = "0.0.7" } # Latest that works on Ubuntu 22.04
nvml-wrapper = "0.12"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
bindgen = "0.72"

[target.'cfg(windows)'.dev-dependencies]
winit = "0.30"
